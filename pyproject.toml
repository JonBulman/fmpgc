[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmpgc"
version = "0.3.0"
description = "FMPGC automation tool"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Jon Bulman" }
]

dependencies = [
    "pandas>=2.0",
    # Add any other packages from requirements.txt here (e.g. Google API libraries)
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fmpgc = "fmpgc_package.fmpgc:main"
fmpgc_gui = "fmpgc_package.fmpgc_gui:main"