[project]
name = "fmpgc"
version = "0.1.0"
description = "FMPGC automation tool"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Jon Bulman" }
]

dependencies = [
    "pandas>=2.0",
    "jon_bulman_utilities>=0.1.0"
]

[tool.setuptools.package-data]
fmpgc = ["../../data/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
fmpgc = "fmpgc.fmpgc:main"

